<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoLocker Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f2f2f7;
  margin: 0;
  padding: 0;
  color: #1a202c;
  overflow-x: hidden;
}
.dashboard-hero {
  position: relative;
  padding: 4rem 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1;
}
h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  color: #2b6cb0;
  margin-bottom: 1rem;
  text-align: center;
}
.bg-icons {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.06;
}
.bg-icons img {
  position: absolute;
  width: 70px; height: 70px;
  animation: float 30s linear infinite;
}
.bg-icons img:nth-child(1) { top: 10%; left: 10%; animation-duration: 25s; }
.bg-icons img:nth-child(2) { top: 60%; left: 75%; animation-duration: 35s; }
.bg-icons img:nth-child(3) { top: 70%; left: 40%; animation-duration: 30s; }
@keyframes float {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(180deg); }
  100% { transform: translateY(0) rotate(360deg); }
}
.bg-graph {
  position: fixed;
  top: 50px;
  left: 0;
  width: 100%;
  height: 300px;
  z-index: 0;
  opacity: 0.04;
  fill: none;
  stroke: #2b6cb0;
  stroke-width: 3;
}
#wallet-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 2rem;
  width: 100%;
  max-width: 1200px;
  margin-top: 2rem;
}
.wallet-card {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 16px;
  padding: 1.5rem 1.2rem;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.wallet-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
.wallet-card p { margin: 0.4rem 0; font-weight: 500; word-break: break-word; font-size: 1rem; }
.wallet-card strong { font-weight: 600; }
.wallet-card button {
  padding: 0.6rem 1rem;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  transition: opacity 0.2s ease;
}
.wallet-card button:hover { opacity: 0.85; }
.attest-btn { background-color: #38a169; color: white; }
.delete-btn { background-color: #e53e3e; color: white; }
#add-wallet-btn {
  display: block;
  margin: 0 auto;
  padding: 0.8rem 2rem;
  font-size: 1.1rem;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #2b6cb0, #3182ce);
  color: white;
  cursor: pointer;
  transition: transform 0.2s ease;
}
#add-wallet-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" />
  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" />
  <img src="https://cryptologos.cc/logos/solana-sol-logo.png" />
</div>
<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<div class="dashboard-hero">
  <h1>CryptoLocker Dashboard</h1>
  <button id="add-wallet-btn">Add Wallet</button>
  <div id="wallet-container"></div>
</div>
