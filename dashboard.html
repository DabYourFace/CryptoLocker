<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | CryptoLocker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #0a0f1f, #02030a); color: #eaeaf0; margin:0; padding:0; overflow-x:hidden; }
  header { display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:20px 60px; position:relative; z-index:5; }
  .logo { font-family: 'Orbitron', sans-serif; font-size:28px; color:#4cc9ff; }
  nav a { margin:0 16px; text-decoration:none; color:#cfd3ff; font-weight:500; }
  nav a:hover { color:#fff; }
  .auth a { padding:8px 14px; border-radius:6px; background:#4cc9ff; color:#02030a; font-weight:600; text-decoration:none; margin-left:10px; }
  .auth a:hover { opacity:0.8; }

  .bg-icons img { position:absolute; width:220px; opacity:0.35; animation: drift 100s linear infinite; }
  .bg-icons img:nth-child(1){ top:15%; left:-10%; }
  .bg-icons img:nth-child(2){ top:50%; left:-20%; animation-duration:120s; }
  .bg-icons img:nth-child(3){ top:70%; left:-25%; animation-duration:140s; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }

  .bg-graph { position:absolute; top:100px; left:0; width:100%; height:300px; z-index:1; }
  .bg-graph polyline { fill:none; stroke:#ff4d6d; stroke-width:3; stroke-dasharray:2000; stroke-dashoffset:2000; animation: draw 4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  main { position:relative; z-index:2; padding:80px 60px 60px 60px; }
  .wallets-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap:20px; }
  .tier { background: rgba(10,15,40,0.85); padding:20px; border-radius:14px; border:1px solid rgba(255,255,255,0.1); }
  .tier h3 { font-family:'Orbitron', sans-serif; margin-bottom:10px; }
  .tier input { width:100%; padding:6px; border-radius:6px; border:1px solid #4cc9ff; background:#02030a; color:#eaeaf0; font-size:14px; margin-bottom:6px; }
  .tier p { margin:4px 0; }
  .tier button { margin-top:6px; padding:6px 12px; border-radius:6px; background:#4cc9ff; border:none; color:#02030a; font-weight:600; cursor:pointer; }

  .add-wallet-card { display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; }
</style>
</head>
<body>

<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" />
  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" />
  <img src="https://cryptologos.cc/logos/solana-sol-logo.png" />
</div>

<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<header>
  <a href="index.html" class="logo">CryptoLocker</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="docs.html">Docs</a>
    <a href="security.html">Security</a>
  </nav>
  <div class="auth">
    <a href="login.html" class="login">Login</a>
    <a href="signup.html" class="signup">Sign Up</a>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Your Dashboard</h1>
    <p>View all your wallets, track balances, and manage your crypto securely in one place.</p>
  </section>

  <section class="features">
    <div class="tiers wallets-grid">
      <!-- Wallet cards appended by JS -->
    </div>
  </section>
</main>

<footer>
  <p>© 2025 CryptoLocker. No custody. No access. No bullshit.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://mxofcfmkdovgyschmgop.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function attestWallet(address) {
  const { data: { session } } = await supabase.auth.getSession();
  const user = session?.user;
  if (!user) return alert("User not logged in");

  await supabase.from('user_logs').insert([{ user_id: user.id, action: `Attested wallet ${address} at ${new Date().toISOString()}` }]);
  alert(`Wallet ${address} attested!`);
}

async function deleteWallet(id) {
  if (!confirm("Are you sure you want to delete this wallet?")) return;

  const { error } = await supabase.from('wallets').delete().eq('id', id);
  if (error) return alert("Error deleting wallet: " + error.message);

  loadWallets();
}

async function loadWallets() {
  const { data: { session } } = await supabase.auth.getSession();
  const user = session?.user;
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  const { data: wallets, error } = await supabase
    .from('wallets')
    .select('*')
    .eq('user_id', user.id)
    .order('added_at', { ascending: false });

  const grid = document.querySelector('.wallets-grid');
  grid.innerHTML = '';

  if (error) {
    grid.innerHTML = `<div class="tier">Error loading wallets: ${error.message}</div>`;
    return;
  }

  if (!wallets || wallets.length === 0) {
    grid.innerHTML = `<div class="tier">No wallets added yet.</div>`;
  } else {
    wallets.forEach(wallet => {
      const card = document.createElement('div');
      card.classList.add('tier');
      card.innerHTML = `
        <h3>${wallet.name || 'Wallet'}</h3>
        <p><strong>Address:</strong> <input type="text" value="${wallet.address}" readonly style="width:300px;"></p>
        <p><strong>Coin Value:</strong> <span style="color:red;">${wallet.balance || 0} ${wallet.chain || ''}</span></p>
        <p><strong>Fiat Value:</strong> <span style="color:green;">${wallet.fiat || 0}</span></p>
        <p><strong>Added:</strong> ${wallet.added_at ? new Date(wallet.added_at).toLocaleDateString() : 'Unknown'}</p>
        <button onclick="attestWallet('${wallet.address}')">Attest Ownership</button>
        <button onclick="deleteWallet('${wallet.id}')">Delete</button>
      `;
      grid.appendChild(card);
    });
  }

  const addCard = document.createElement('div');
  addCard.classList.add('tier', 'add-wallet-card');
  addCard.innerHTML = `<button id="add-wallet">+ Add Wallet</button>`;
  grid.appendChild(addCard);

  document.getElementById('add-wallet').addEventListener('click', async () => {
    const address = prompt("Enter wallet address:");
    if (!address) return;

    const { data: { session } } = await supabase.auth.getSession();
    const user = session?.user;
    if (!user) return alert("User not logged in");

    const { error } = await supabase.from('wallets').insert([{ user_id: user.id, address, added_at: new Date().toISOString() }]);
    if (error) return alert("Error adding wallet: " + error.message);

    loadWallets();
  });
}

loadWallets();
</script>
</body>
</html>
