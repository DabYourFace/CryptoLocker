<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoLocker Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body {
  font-family: 'Inter', sans-serif;
  background: #1e1e2f;
  margin: 0;
  padding: 0;
  color: #f0f0f5;
  overflow-x: hidden;
}
.dashboard-hero {
  position: relative;
  padding: 6rem 2rem 4rem 2rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1;
}
.dashboard-gradient {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, #4c00ff, #6a1bff);
  opacity: 0.08;
  z-index: 0;
}
.bg-icons {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.06;
}
.bg-icons img { position: absolute; width: 80px; height: 80px; animation: float 30s linear infinite; }
.bg-icons img:nth-child(1) { top: 15%; left: 10%; animation-duration: 25s; content:url('https://cryptologos.cc/logos/polygon-matic-logo.png'); }
.bg-icons img:nth-child(2) { top: 55%; left: 70%; animation-duration: 35s; content:url('https://cryptologos.cc/logos/avalanche-avax-logo.png'); }
.bg-icons img:nth-child(3) { top: 75%; left: 40%; animation-duration: 30s; content:url('https://cryptologos.cc/logos/cardano-ada-logo.png'); }
@keyframes float { 0% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(180deg); } 100% { transform: translateY(0) rotate(360deg); } }
.bg-graph { position: fixed; top: 50px; left: 0; width: 100%; height: 300px; z-index: 0; opacity: 0.04; fill: none; stroke: #6a1bff; stroke-width: 3; }
h1 { font-family: 'Orbitron', sans-serif; font-weight: 800; color: #6a1bff; margin-bottom: 2rem; z-index: 1; position: relative; text-align: center; }
#error-container { text-align: center; color: #ff4c4c; margin-bottom: 1rem; z-index: 1; position: relative; }
#add-wallet-btn, #download-all-btn {
  display: block;
  margin: 0 auto 1.5rem auto;
  padding: 0.8rem 2rem;
  font-size: 1.1rem;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #4c00ff, #6a1bff);
  color: white;
  cursor: pointer;
  transition: transform 0.2s ease;
  position: relative;
  z-index: 1;
}
#add-wallet-btn:hover, #download-all-btn:hover { transform: scale(1.05); }
#wallet-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; width: 100%; max-width: 1200px; z-index: 1; position: relative; }
.wallet-card { background: rgba(30, 30, 50, 0.95); border-radius: 16px; padding: 1.5rem 1.2rem; box-shadow: 0 6px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 0.7rem; transition: transform 0.2s ease, box-shadow 0.2s ease; }
.wallet-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
.wallet-card p { margin: 0.4rem 0; font-weight: 500; word-break: break-word; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.wallet-card strong { font-weight: 600; }
.btc-balance { color: #ff6f61; }
.usd-balance { color: #00ff9e; }
select.fiat-select { border-radius: 6px; border: 1px solid #555; padding: 2px 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; background: #1e1e2f; color: #f0f0f5; }
.wallet-card button { padding: 0.6rem 1rem; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: opacity 0.2s ease; }
.wallet-card button:hover { opacity: 0.85; }
.attest-btn { background-color: #00ff9e; color: #1e1e2f; }
.delete-btn { background-color: #ff4c4c; color: #1e1e2f; }
.download-btn { background-color: #6a1bff; color: #f0f0f5; }
@media(max-width: 600px) { .dashboard-hero { padding: 4rem 1rem 2rem 1rem; } #wallet-container { gap: 1rem; } }
</style>
</head>
<body>

<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/polygon-matic-logo.png" />
  <img src="https://cryptologos.cc/logos/avalanche-avax-logo.png" />
  <img src="https://cryptologos.cc/logos/cardano-ada-logo.png" />
</div>

<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<div class="dashboard-hero">
  <div class="dashboard-gradient"></div>
  <h1>CryptoLocker Dashboard</h1>
  <div id="error-container"></div>
  <button id="add-wallet-btn">Add Wallet</button>
  <button id="download-all-btn">Download Full PDF</button>
  <div id="wallet-container"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const SUPABASE_URL = 'https://mxofcfmkdovgyschmgop.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const walletContainer = document.getElementById('wallet-container');
const addWalletBtn = document.getElementById('add-wallet-btn');
const downloadAllBtn = document.getElementById('download-all-btn');
const errorContainer = document.getElementById('error-container');

const FIATS = ['USD', 'EUR', 'GBP'];
let walletCards = [];

function formatDate(ts){ return new Date(ts).toLocaleString(); }

async function fetchBTCBalance(address){
  try{
    const res = await fetch(`https://blockstream.info/api/address/${address}`);
    if(!res.ok) throw new Error('Blockchain API error');
    const data = await res.json();
    return (data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum)/1e8;
  }catch{return 'error';}
}

async function fetchUSD(btc, fiat='USD'){
  try{
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=${fiat.toLowerCase()}`);
    if(!res.ok) throw new Error('CoinGecko error');
    const data = await res.json();
    return btc !== 'error' ? (btc*data.bitcoin[fiat.toLowerCase()]).toFixed(2) : 'error';
  }catch{return 'error';}
}

async function createWalletCards(user){
  walletContainer.innerHTML = '';
  walletCards = [];

  const { data: wallets, error } = await supabase.from('wallets').select('*').eq('user_id', user.id);
  if(error) { errorContainer.textContent = 'Error loading wallets: '+error.message; return; }
  if(!wallets?.length){ walletContainer.innerHTML = '<p style="text-align:center;">No wallets added yet.</p>'; return; }

  for(const w of wallets){
    const card = document.createElement('div');
    card.className='wallet-card';
    card.innerHTML = `
      <p><strong>Address:</strong> ${w.address}</p>
      <p><strong>BTC:</strong> <span class="btc-balance">loading...</span></p>
      <p>
        <strong>Fiat:</strong> <span class="usd-balance">loading...</span>
        <select class="fiat-select">
          ${FIATS.map(f=>`<option value="${f}" ${f==='USD'?'selected':''}>${f}</option>`).join('')}
        </select>
      </p>
      <p><strong>Added:</strong> ${formatDate(w.added_at)}</p>
      <button class="attest-btn">Attest Ownership</button>
      <button class="delete-btn">Delete Wallet</button>
    `;
    const btcSpan = card.querySelector('.btc-balance');
    const usdSpan = card.querySelector('.usd-balance');
    const selectEl = card.querySelector('.fiat-select');
    let fiat = selectEl.value;
    async function updateBalances(){ const btc = await fetchBTCBalance(w.address); btcSpan.textContent = btc; const fiatBal = await fetchUSD(btc, fiat); usdSpan.textContent = fiatBal; }
    selectEl.addEventListener('change', ()=>{ fiat = selectEl.value; updateBalances(); });
    card.querySelector('.attest-btn').addEventListener('click', async ()=> { const { error } = await supabase.from('user_logs').insert([{ user_id:user.id, action:`Attested wallet ${w.address}` }]); if(error) alert('Attest failed: '+error.message); else alert(`Wallet ${w.address} attested successfully.`); });
    card.querySelector('.delete-btn').addEventListener('click', async ()=> { if(!confirm(`Delete wallet ${w.address}?`)) return; const { error } = await supabase.from('wallets').delete().eq('id',w.id); if(error) alert('Delete failed: '+error.message); else { card.remove(); walletCards = walletCards.filter(c=>c.card!==card); } });
    walletContainer.appendChild(card);
    walletCards.push({ card, updateBalances });
    updateBalances();
  }

  downloadAllBtn.addEventListener('click', async () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    let y = 80;

    // watermark 4% opacity
    doc.setTextColor(0,0,0,0.04);
    doc.setFontSize(60);
    doc.text('CryptoLocker', 200, 400, { angle: 45, align: 'center' });
    doc.setTextColor(0, 0, 0);

    const logoUrl = 'https://cryptologos.cc/logos/bitcoin-btc-logo.png';
    const logoImg = new Image();
    logoImg.src = logoUrl;
    await new Promise(resolve => { logoImg.onload = resolve; });
    doc.addImage(logoImg, 'PNG', 40, 40, 50, 50);

    function addHeaderFooter(pageNum){
      doc.setFontSize(10);
      doc.setFont('helvetica','bold');
      doc.text('CONFIDENTIAL', 260, 30);
      doc.text(`Page ${pageNum}`, 500, 820);
    }

    let pageNum = 1;
    addHeaderFooter(pageNum);

    doc.setFontSize(22);
    doc.setFont('helvetica', 'bold');
    doc.text('CryptoLocker Official Attestation', 110, 70);
    y += 20;
    doc.setFontSize(12);
    doc.setFont('helvetica', 'normal');
    doc.text(`Date: ${new Date().toLocaleString()}`, 40, y+10);
    doc.text(`Username: ${user.user_metadata?.username || user.email}`, 40, y+25);
    doc.text(`Account Email: ${user.email}`, 40, y+40);
    doc.text(`Account Created: ${formatDate(user.created_at)}`, 40, y+55);
    y += 80;

    const { data: wallets } = await supabase.from('wallets').select('*').eq('user_id', user.id);
    for (const w of wallets) {
      const btc = await fetchBTCBalance(w.address);
      const usd = await fetchUSD(btc);
      const { data: logs } = await supabase
        .from('user_logs')
        .select('*')
        .eq('user_id', user.id)
        .like('action', `%${w.address}%`)
        .order('created_at', { ascending: true });
      const lastAtt = logs?.length ? formatDate(logs[logs.length - 1].created_at) : 'N/A';
      const attestationsText = logs.map(l => `${l.action} at ${formatDate(l.created_at)}`).join('\n');

      const boxX = 40, boxWidth = 520, boxHeight = 130;
      if (y + boxHeight > doc.internal.pageSize.height - 60) { 
        doc.addPage(); 
        y = 80; 
        pageNum++;
        addHeaderFooter(pageNum);
      }

      doc.setDrawColor(0);
      doc.setFillColor(245, 245, 245);
      doc.rect(boxX, y, boxWidth, boxHeight, 'F');

      let innerY = y + 20;
      doc.setFont('helvetica', 'bold');
      doc.text('Wallet Address:', boxX + 10, innerY);
      doc.setFont('helvetica', 'normal');
      doc.text(w.address, boxX + 130, innerY);
      innerY += 20;

      doc.text(`BTC Balance: ${btc}`, boxX + 10, innerY);
      doc.text(`USD Balance: ${usd}`, boxX + 180, innerY);
      innerY += 20;

      doc.text(`Added: ${formatDate(w.added_at)}`, boxX + 10, innerY);
      doc.text(`Last Attestation: ${lastAtt}`, boxX + 180, innerY);
      innerY += 20;

      if (attestationsText) {
        doc.setFont('helvetica', 'italic');
        doc.text('Attestation Log:', boxX + 10, innerY);
        doc.setFont('helvetica', 'normal');
        doc.text(doc.splitTextToSize(attestationsText, boxWidth - 20), boxX + 10, innerY + 15);
      }

      y += boxHeight + 20;
    }

    doc.setFontSize(10);
    doc.setFont('helvetica', 'italic');
    doc.text(
      'CryptoLocker: This attestation report is an official document for verification and legal purposes.',
      40,
      doc.internal.pageSize.height - 40
    );

    doc.save(`CryptoLocker_Attestation_${new Date().toISOString().split('T')[0]}.pdf`);
  });
}

async function checkAuth(){
  const { data:{ session } } = await supabase.auth.getSession();
  if(!session){ window.location.href='login.html'; return; }
  const user = session.user;
  createWalletCards(user);
  addWalletBtn.addEventListener('click', async ()=> { const address = prompt('Enter BTC wallet address:'); if(!address) return; const { error } = await supabase.from('wallets').insert([{ user_id:user.id,address,added_at:new Date().toISOString() }]); if(error) alert('Failed to add wallet: '+error.message); else createWalletCards(user); });
  setInterval(()=>walletCards.forEach(c=>c.updateBalances()), 5000);
}
checkAuth();
</script>

</body>
</html>
