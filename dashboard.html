<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | CryptoLocker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Inter', sans-serif; background: radial-gradient(circle at top, #0a0f1f, #02030a); color:#eaeaf0; margin:0; padding:0; overflow-x:hidden; }
header { display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:20px 60px; position:relative; z-index:5;}
.logo { font-family:'Orbitron', sans-serif; font-size:28px; color:#4cc9ff; }
nav a { margin:0 16px; text-decoration:none; color:#cfd3ff; font-weight:500; }
nav a:hover { color:#fff; }
.auth a { padding:8px 14px; border-radius:6px; background:#4cc9ff; color:#02030a; font-weight:600; text-decoration:none; }
.auth a:hover { opacity:0.8; }
.bg-icons img { position:absolute; width:220px; opacity:0.35; animation:drift 100s linear infinite; }
.bg-icons img:nth-child(1){ top:15%; left:-10%; }
.bg-icons img:nth-child(2){ top:50%; left:-20%; animation-duration:120s; }
.bg-icons img:nth-child(3){ top:70%; left:-25%; animation-duration:140s; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }
.bg-graph { position:absolute; top:100px; left:0; width:100%; height:300px; z-index:1; }
.bg-graph polyline { fill:none; stroke:#ff4d6d; stroke-width:3; stroke-dasharray:2000; stroke-dashoffset:2000; animation: draw 4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }
main { position:relative; z-index:2; padding:100px 40px 40px 40px; }
.wallets-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
.tier { background: rgba(10,15,40,0.85); padding:20px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); }
.tier h3 { margin:0 0 8px 0; font-family:'Orbitron', sans-serif; color:#4cc9ff; word-break:break-word; }
.tier p { margin:4px 0; }
.wallet-address { font-size:14px; word-break:break-all; }
.wallet-balance { color:red; font-weight:600; }
.wallet-fiat { color:green; font-weight:600; }
button { padding:8px 14px; border-radius:6px; background:#4cc9ff; border:none; color:#02030a; font-weight:600; cursor:pointer; margin-top:6px; }
button:hover { opacity:0.85; }
.add-wallet-card button { width:100%; font-size:16px; }
</style>
</head>
<body>

<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" />
  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" />
  <img src="https://cryptologos.cc/logos/solana-sol-logo.png" />
</div>

<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<header>
  <a href="index.html" class="logo">CryptoLocker</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="docs.html">Docs</a>
    <a href="security.html">Security</a>
  </nav>
  <div class="auth">
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </div>
</header>

<main>
  <h1>Your Dashboard</h1>
  <div class="wallets-grid" id="wallets-grid">
    <div class="tier add-wallet-card">
      <button id="add-wallet-btn">+ Add Wallet</button>
    </div>
  </div>
</main>

<footer>
  <p>© 2025 CryptoLocker. No custody. No access. No bullshit.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://mxofcfmkdovgyschmgop.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadWallets() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { window.location.href='login.html'; return; }

  const { data: wallets, error } = await supabase.from('wallets').select('*').eq('user_id', user.id);
  if (error) { alert('Error fetching wallets: '+error.message); return; }

  const grid = document.getElementById('wallets-grid');
  grid.innerHTML = '';

  if (!wallets || wallets.length===0) {
    const noWallet = document.createElement('div');
    noWallet.classList.add('tier');
    noWallet.textContent = 'No wallets added yet.';
    grid.appendChild(noWallet);
  }

  for (const w of wallets) {
    const tier = document.createElement('div');
    tier.classList.add('tier');

    const addressP = document.createElement('p');
    addressP.classList.add('wallet-address');
    addressP.textContent = w.address;

    const balanceP = document.createElement('p');
    balanceP.innerHTML = `Balance: <span class="wallet-balance">${w.balance || '0'} ${w.chain || 'BTC'}</span> / <span class="wallet-fiat">${w.fiat_value || '0'} USD</span>`;

    const addedP = document.createElement('p');
    const addedDate = w.added_at ? new Date(w.added_at).toLocaleDateString() : 'Unknown';
    addedP.textContent = `Added: ${addedDate}`;

    const attestBtn = document.createElement('button');
    attestBtn.textContent = 'Attest Ownership';
    attestBtn.onclick = async () => {
      const timestamp = new Date().toISOString();
      await supabase.from('user_logs').insert([{ user_id: user.id, action: `Attested wallet ${w.address} at ${timestamp}` }]);
      alert(`Wallet ${w.address} attested at ${timestamp}`);
    };

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete Wallet';
    deleteBtn.onclick = async () => {
      if (confirm(`Delete wallet ${w.address}?`)) {
        await supabase.from('wallets').delete().eq('id', w.id);
        loadWallets();
      }
    };

    tier.appendChild(addressP);
    tier.appendChild(balanceP);
    tier.appendChild(addedP);
    tier.appendChild(attestBtn);
    tier.appendChild(deleteBtn);

    grid.appendChild(tier);
  }

  const addCard = document.createElement('div');
  addCard.classList.add('tier','add-wallet-card');
  const addBtn = document.createElement('button');
  addBtn.textContent = '+ Add Wallet';
  addBtn.onclick = () => {
    const addr = prompt('Enter wallet address:');
    if (!addr) return;
    supabase.auth.getUser().then(({data:{user}})=>{
      supabase.from('wallets').insert([{user_id:user.id,address:addr}]).then(()=>loadWallets());
    });
  };
  addCard.appendChild(addBtn);
  grid.appendChild(addCard);
}

loadWallets();
</script>
</body>
</html>
