<section class="features">
  <div class="tiers wallets-grid">
    <!-- Wallet cards appended here via JS -->
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  async function loadWallets() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session || !session.user) { window.location.href = 'login.html'; return; }

    const user = session.user;
    const grid = document.querySelector('.wallets-grid');
    grid.innerHTML = '';

    const { data: wallets, error } = await supabase
      .from('wallets')
      .select('*')
      .eq('user_id', user.id)
      .order('added_at', { ascending: false });

    if (error) {
      grid.innerHTML = `<div class="tier">Error loading wallets: ${error.message}</div>`;
      return;
    }

    if (!wallets || wallets.length === 0) {
      grid.innerHTML = `<div class="tier">No wallets added yet.</div>`;
    } else {
      wallets.forEach(wallet => {
        const card = document.createElement('div');
        card.classList.add('tier');
        card.innerHTML = `
          <h3>${wallet.name || 'Wallet'}</h3>
          <p><strong>Address:</strong> ${wallet.address}</p>
          <p><strong>Balance:</strong> 0 BTC</p>
          <div style="margin-top:10px;">
            <button class="get-started attest-btn">Attest Ownership</button>
            <button class="get-started delete-btn" style="background:#ff4d6d; margin-left:8px;">Delete</button>
          </div>
        `;
        grid.appendChild(card);

        // Attach button handlers
        card.querySelector('.attest-btn').addEventListener('click', async () => {
          await supabase.from('user_logs').insert([{
            user_id: user.id,
            action: `Attested wallet ${wallet.address} at ${new Date().toISOString()}`
          }]);
          alert('Wallet attested!');
        });
        card.querySelector('.delete-btn').addEventListener('click', async () => {
          if (confirm('Delete this wallet?')) {
            await supabase.from('wallets').delete().eq('id', wallet.id);
            loadWallets();
          }
        });
      });
    }

    // Add Wallet card
    const addCard = document.createElement('div');
    addCard.classList.add('tier');
    addCard.innerHTML = `<button id="add-wallet" class="get-started">+ Add Wallet</button>`;
    grid.appendChild(addCard);

    document.getElementById('add-wallet').addEventListener('click', async () => {
      const address = prompt('Enter BTC wallet address:');
      if (!address) return;
      await supabase.from('wallets').insert([{ user_id: user.id, address, added_at: new Date().toISOString() }]);
      loadWallets();
    });
  }

  loadWallets();
});
</script>
