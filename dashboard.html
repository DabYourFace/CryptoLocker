<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | CryptoLocker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Inter', sans-serif; background: radial-gradient(circle at top, #0a0f1f, #02030a); color:#eaeaf0; margin:0; padding:0; overflow-x:hidden;}
header { display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:20px 60px; position:relative; z-index:5;}
.logo { font-family:'Orbitron', sans-serif; font-size:28px; color:#4cc9ff; }
nav a { margin:0 16px; text-decoration:none; color:#cfd3ff; font-weight:500; }
nav a:hover { color:#fff; }
.auth a { padding:8px 14px; border-radius:6px; background:#4cc9ff; color:#02030a; font-weight:600; text-decoration:none; }
.auth a:hover { opacity:0.8; }

.bg-icons img { position:absolute; width:220px; opacity:0.35; animation: drift 100s linear infinite; }
.bg-icons img:nth-child(1){ top:15%; left:-10%; }
.bg-icons img:nth-child(2){ top:50%; left:-20%; animation-duration:120s; }
.bg-icons img:nth-child(3){ top:70%; left:-25%; animation-duration:140s; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }

.bg-graph { position:absolute; top:100px; left:0; width:100%; height:300px; z-index:1; }
.bg-graph polyline { fill:none; stroke:#ff4d6d; stroke-width:3; stroke-dasharray:2000; stroke-dashoffset:2000; animation: draw 4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }

main { padding:120px 60px 60px 60px; position:relative; z-index:2; }
.wallets-grid { display:flex; flex-wrap:wrap; gap:20px; margin-top:30px; }
.tier { background: rgba(10,15,40,0.85); border-radius:12px; padding:20px; border:1px solid rgba(255,255,255,0.1); width:300px; word-break: break-all; }
.tier h3 { font-family:'Orbitron', sans-serif; color:#4cc9ff; margin-bottom:10px; }
.wallet-balance { color:red; font-weight:600; }
.wallet-fiat { color:limegreen; font-weight:600; }
.wallet-address { width:100%; overflow-x:auto; font-size:14px; background:#02030a; padding:6px; border-radius:6px; border:1px solid #4cc9ff; margin-bottom:6px; }
button { padding:8px 12px; border-radius:6px; background:#4cc9ff; border:none; color:#02030a; font-weight:600; cursor:pointer; margin-top:6px; }
.add-wallet-card { display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; cursor:pointer; height:120px; }
</style>
</head>
<body>

<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png">
  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png">
  <img src="https://cryptologos.cc/logos/solana-sol-logo.png">
</div>

<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<header>
  <a href="index.html" class="logo">CryptoLocker</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="docs.html">Docs</a>
    <a href="security.html">Security</a>
  </nav>
  <div class="auth">
    <a href="login.html" class="login">Login</a>
    <a href="signup.html" class="signup">Sign Up</a>
  </div>
</header>

<main>
  <h1>Your Dashboard</h1>
  <div class="wallets-grid" id="walletsGrid">
    <div class="tier add-wallet-card" id="addWalletCard">+ Add Wallet</div>
  </div>
</main>

<footer>
  <p>© 2025 CryptoLocker. No custody. No access. No bullshit.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mxofcfmkdovgyschmgop.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadWallets() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  const { data: wallets } = await client
    .from('wallets')
    .select('*')
    .eq('user_id', user.id)
    .order('added_at', { ascending: false });

  const grid = document.getElementById('walletsGrid');
  grid.innerHTML = '';

  if (!wallets || wallets.length === 0) {
    grid.innerHTML = `<div class="tier">No wallets added yet.</div>`;
  } else {
    wallets.forEach(w => {
      const card = document.createElement('div');
      card.classList.add('tier');

      const addedDate = w.added_at ? new Date(w.added_at).toLocaleDateString() : 'Unknown';

      card.innerHTML = `
        <h3>${w.name || 'Wallet'}</h3>
        <div class="wallet-address">${w.address}</div>
        <p>Balance: <span class="wallet-balance">${w.balance || 0} ${w.chain || ''}</span></p>
        <p>Value (fiat): <span class="wallet-fiat">${w.fiat || '0'} USD</span></p>
        <p>Added: ${addedDate}</p>
      `;

      const attestBtn = document.createElement('button');
      attestBtn.textContent = 'Attest Ownership';
      attestBtn.onclick = async () => {
        const timestamp = new Date().toISOString();
        await client.from('user_logs').insert([{ user_id: user.id, action: `Attested wallet ${w.address} at ${timestamp}` }]);
        alert(`Wallet ${w.address} attested at ${timestamp}`);
      };

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Delete Wallet';
      deleteBtn.onclick = async () => {
        if(confirm('Delete this wallet?')) {
          await client.from('wallets').delete().eq('id', w.id);
          loadWallets();
        }
      };

      card.appendChild(attestBtn);
      card.appendChild(deleteBtn);
      grid.appendChild(card);
    });
  }

  const addCard = document.createElement('div');
  addCard.classList.add('tier', 'add-wallet-card');
  addCard.id = 'addWalletCard';
  addCard.textContent = '+ Add Wallet';
  addCard.onclick = () => alert('Add wallet functionality goes here.');
  grid.appendChild(addCard);
}

loadWallets();
</script>
</body>
</html>
