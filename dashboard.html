<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | CryptoLocker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #0a0f1f, #02030a); color: #eaeaf0; margin:0; padding:0; overflow-x:hidden; }
header { display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:20px 60px; position:relative; z-index:5; }
.logo { font-family: 'Orbitron', sans-serif; font-size:28px; color:#4cc9ff; }
nav a { margin:0 16px; text-decoration:none; color:#cfd3ff; font-weight:500; }
nav a:hover { color:#fff; }
.auth a { padding:8px 14px; border-radius:6px; background:#4cc9ff; color:#02030a; font-weight:600; text-decoration:none; }
.auth a:hover { opacity:0.8; }

.bg-icons img { position:absolute; width:220px; opacity:0.35; animation: drift 100s linear infinite; }
.bg-icons img:nth-child(1){ top:15%; left:-10%; }
.bg-icons img:nth-child(2){ top:50%; left:-20%; animation-duration:120s; }
.bg-icons img:nth-child(3){ top:70%; left:-25%; animation-duration:140s; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }

.bg-graph { position:absolute; top:100px; left:0; width:100%; height:300px; z-index:1; }
.bg-graph polyline { fill:none; stroke:#ff4d6d; stroke-width:3; stroke-dasharray:2000; stroke-dashoffset:2000; animation: draw 4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }

main { padding: 100px 40px 40px 40px; position:relative; z-index:2; }
.wallets-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap:20px; margin-top:20px; }
.tier { background: rgba(10,15,40,0.85); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:20px; word-break: break-word; }
.wallet-address { width:100%; font-family: monospace; color:#eaeaf0; overflow-x:auto; }
.balance-btc { color: #ff4d4d; font-weight:600; }
.balance-fiat { color: #4dff4d; font-weight:600; }
button { padding:10px 16px; border:none; border-radius:6px; background:#4cc9ff; color:#02030a; font-weight:600; cursor:pointer; margin-top:10px; }
</style>
</head>
<body>

<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" />
  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" />
  <img src="https://cryptologos.cc/logos/solana-sol-logo.png" />
</div>

<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<header>
  <a href="index.html" class="logo">CryptoLocker</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="docs.html">Docs</a>
    <a href="security.html">Security</a>
  </nav>
  <div class="auth">
    <a href="login.html" class="login">Login</a>
    <a href="signup.html" class="signup">Sign Up</a>
  </div>
</header>

<main>
  <h1>Your Dashboard</h1>
  <div class="wallets-grid" id="walletsGrid">
    <!-- Wallet cards added via JS -->
  </div>
</main>

<footer>
  <p>© 2025 CryptoLocker. No custody. No access. No bullshit.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://mxofcfmkdovgyschmgop.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

async function loadWallets() {
  const { data: { session }, error: sessionError } = await supabase.auth.getSession();
  if (sessionError || !session) { window.location.href = 'login.html'; return; }
  const user = session.user;

  const { data: wallets, error } = await supabase.from('wallets').select('*').eq('user_id', user.id);
  const grid = document.getElementById('walletsGrid');
  grid.innerHTML = '';

  if (error) {
    grid.innerHTML = `<div class="tier">Error loading wallets: ${error.message}</div>`;
    return;
  }

  if (!wallets || wallets.length === 0) {
    grid.innerHTML = `<div class="tier">No wallets added yet.</div>`;
  }

  const fiat = 'usd'; // You can add a fiat selector if needed

  for (const w of wallets) {
    const card = document.createElement('div');
    card.className = 'tier';
    card.innerHTML = `
      <div class="wallet-address">${w.address}</div>
      <div><span class="balance-btc">BTC: Loading...</span> | <span class="balance-fiat">USD: Loading...</span></div>
      <div>Added: ${new Date(w.added_at).toLocaleString()}</div>
      <button class="attest-btn">Attest Ownership</button>
      <button class="delete-btn">Delete Wallet</button>
    `;
    grid.appendChild(card);

    // Attest
    card.querySelector('.attest-btn').onclick = async () => {
      await supabase.from('user_logs').insert([{ user_id: user.id, action: `Attested wallet ${w.address} at ${new Date().toISOString()}` }]);
      alert(`Wallet ${w.address} attested.`);
    };

    // Delete
    card.querySelector('.delete-btn').onclick = async () => {
      if (!confirm(`Delete wallet ${w.address}?`)) return;
      await supabase.from('wallets').delete().eq('id', w.id);
      loadWallets();
    };

    // Fetch BTC and fiat
    (async () => {
      try {
        const resp = await fetch(`https://blockstream.info/api/address/${w.address}`);
        const data = await resp.json();
        const balanceSats = data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum;
        const balanceBTC = balanceSats / 1e8;
        const fiatResp = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=${fiat}`);
        const fiatData = await fiatResp.json();
        const balanceFiat = (balanceBTC * fiatData.bitcoin[fiat]).toFixed(2);
        card.querySelector('.balance-btc').textContent = `BTC: ${balanceBTC}`;
        card.querySelector('.balance-fiat').textContent = `USD: ${balanceFiat}`;
      } catch (err) {
        console.error(err);
        card.querySelector('.balance-btc').textContent = `BTC: Error`;
        card.querySelector('.balance-fiat').textContent = `USD: Error`;
      }
    })();
  }

  // Add Wallet button
  const addCard = document.createElement('div');
  addCard.className = 'tier';
  addCard.innerHTML = `<button id="add-wallet-btn">+ Add Wallet</button>`;
  grid.appendChild(addCard);

  document.getElementById('add-wallet-btn').onclick = () => {
    const walletAddress = prompt('Enter new BTC wallet address:');
    if (!walletAddress) return;
    supabase.from('wallets').insert([{ user_id: user.id, address: walletAddress, added_at: new Date().toISOString() }])
      .then(() => loadWallets());
  };
}

loadWallets();
</script>
</body>
</html>
