<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | CryptoLocker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #0a0f1f, #02030a); color: #eaeaf0; margin:0; padding:0; overflow-x:hidden; }
header { display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:20px 60px; position:relative; z-index:5; }
.logo { font-family: 'Orbitron', sans-serif; font-size:28px; color:#4cc9ff; }
nav a { margin:0 16px; text-decoration:none; color:#cfd3ff; font-weight:500; }
nav a:hover { color:#fff; }
.auth a { padding:8px 14px; border-radius:6px; background:#4cc9ff; color:#02030a; font-weight:600; text-decoration:none; margin-left:10px; }
.auth a:hover { opacity:0.8; }

.bg-icons img { position:absolute; width:220px; opacity:0.35; animation: drift 100s linear infinite; }
.bg-icons img:nth-child(1){ top:15%; left:-10%; }
.bg-icons img:nth-child(2){ top:50%; left:-20%; animation-duration:120s; }
.bg-icons img:nth-child(3){ top:70%; left:-25%; animation-duration:140s; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }

.bg-graph { position:absolute; top:100px; left:0; width:100%; height:300px; z-index:1; }
.bg-graph polyline { fill:none; stroke:#ff4d6d; stroke-width:3; stroke-dasharray:2000; stroke-dashoffset:2000; animation: draw 4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }

main { padding: 100px 60px 40px; z-index:2; position:relative; }
.wallets-grid { display: flex; flex-wrap: wrap; gap:20px; }
.tier { background: rgba(10,15,40,0.85); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px; min-width: 350px; max-width: 450px; flex:1; }
.wallet-address { word-break: break-all; font-weight:600; margin-bottom:8px; }
.balance-btc { color:red; font-weight:600; }
.balance-fiat { color:limegreen; font-weight:600; }
button { padding:8px 12px; border-radius:6px; border:none; cursor:pointer; font-weight:600; margin-top:6px; }
.add-wallet-btn { background:#4cc9ff; color:#02030a; }
.attest-btn { background:#ff9500; color:#02030a; margin-left:6px; }
.delete-btn { background:red; color:#fff; margin-left:6px; }
</style>
</head>
<body>

<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" />
  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" />
  <img src="https://cryptologos.cc/logos/solana-sol-logo.png" />
</div>

<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<header>
  <a href="index.html" class="logo">CryptoLocker</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="docs.html">Docs</a>
    <a href="security.html">Security</a>
  </nav>
  <div class="auth">
    <a href="login.html" class="login">Login</a>
    <a href="signup.html" class="signup">Sign Up</a>
  </div>
</header>

<main>
  <h1>Your Wallets</h1>
  <div class="wallets-grid" id="walletsGrid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// Only declare supabase once
if (typeof supabase === 'undefined') {
  const SUPABASE_URL = 'https://mxofcfmkdovgyschmgop.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
  window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const grid = document.getElementById('walletsGrid');

async function loadWallets() {
  const { data: { user }, error: userError } = await supabase.auth.getUser();
  if (!user || userError) {
    window.location.href = 'login.html';
    return;
  }

  const { data: wallets, error } = await supabase
    .from('wallets')
    .select('*')
    .eq('user_id', user.id)
    .order('added_at', { ascending: false });

  if (error) {
    grid.innerHTML = `<p>Error loading wallets: ${error.message}</p>`;
    return;
  }

  grid.innerHTML = '';

  if (!wallets || wallets.length === 0) {
    grid.innerHTML = `<div class="tier"><em>No wallets added yet.</em></div>`;
  } else {
    for (const w of wallets) {
      const card = document.createElement('div');
      card.classList.add('tier');

      const addedDate = w.added_at ? new Date(w.added_at).toLocaleString() : 'Unknown';

      card.innerHTML = `
        <div class="wallet-address">${w.address}</div>
        <div class="balance-btc">BTC: ${w.balance || '0'}</div>
        <div class="balance-fiat">Fiat: ${w.fiat_value || '0'}</div>
        <div>Added: ${addedDate}</div>
      `;

      // Attest button
      const attestBtn = document.createElement('button');
      attestBtn.className = 'attest-btn';
      attestBtn.textContent = 'Attest';
      attestBtn.onclick = async () => {
        const timestamp = new Date().toISOString();
        await supabase.from('user_logs').insert([{ user_id: user.id, action: `Attested wallet ${w.address} at ${timestamp}` }]);
        alert(`Wallet ${w.address} attested at ${timestamp}`);
      };

      // Delete button
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.onclick = async () => {
        if (confirm(`Delete wallet ${w.address}?`)) {
          await supabase.from('wallets').delete().eq('id', w.id);
          loadWallets();
        }
      };

      // Append buttons
      card.appendChild(attestBtn);
      card.appendChild(deleteBtn);

      grid.appendChild(card);
    }
  }

  // Add wallet button at the end
  const addCard = document.createElement('div');
  addCard.classList.add('tier');
  const addBtn = document.createElement('button');
  addBtn.className = 'add-wallet-btn';
  addBtn.textContent = '+ Add Wallet';
  addBtn.onclick = () => {
    const address = prompt('Enter wallet address:');
    if (!address) return;
    supabase.auth.getUser().then(async ({ data: { user } }) => {
      await supabase.from('wallets').insert([{ user_id: user.id, address }]);
      loadWallets();
    });
  };
  addCard.appendChild(addBtn);
  grid.appendChild(addCard);
}

loadWallets();
</script>
</body>
</html>
