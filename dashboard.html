<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | CryptoLocker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #0a0f1f, #02030a); color: #eaeaf0; margin:0; padding:0; overflow-x:hidden; }
  header { display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:20px 60px; position:relative; z-index:5;}
  .logo { font-family: 'Orbitron', sans-serif; font-size:28px; color:#4cc9ff; }
  nav a { margin:0 16px; text-decoration:none; color:#cfd3ff; font-weight:500; }
  nav a:hover { color:#fff; }
  .auth a { padding:8px 14px; border-radius:6px; background:#4cc9ff; color:#02030a; font-weight:600; text-decoration:none; margin-left:8px;}
  .auth a:hover { opacity:0.8; }

  .bg-icons img { position:absolute; width:220px; opacity:0.35; animation: drift 100s linear infinite; }
  .bg-icons img:nth-child(1){ top:15%; left:-10%; }
  .bg-icons img:nth-child(2){ top:50%; left:-20%; animation-duration:120s; }
  .bg-icons img:nth-child(3){ top:70%; left:-25%; animation-duration:140s; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(160vw); } }

  .bg-graph { position:absolute; top:100px; left:0; width:100%; height:300px; z-index:1; }
  .bg-graph polyline { fill:none; stroke:#ff4d6d; stroke-width:3; stroke-dasharray:2000; stroke-dashoffset:2000; animation: draw 4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  main { padding: 120px 40px 40px 40px; position:relative; z-index:2; }
  h1 { font-family:'Orbitron', sans-serif; color:#4cc9ff; margin-bottom:16px; }
  p { max-width:700px; }

  .wallets-grid { display:flex; flex-wrap:wrap; gap:16px; margin-top:24px; }
  .wallet-card { background: rgba(10,15,40,0.85); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px; flex: 1 1 320px; min-width:320px; box-sizing:border-box; }
  .wallet-card h3 { margin-top:0; font-family:'Orbitron', sans-serif; font-size:18px; margin-bottom:8px; }
  .wallet-card p { margin:4px 0; word-break:break-all; }
  .balance-btc { color:#ff4d4d; font-weight:600; }
  .balance-fiat { color:#4dff88; font-weight:600; }

  .wallet-card button { margin-top:8px; padding:6px 12px; border:none; border-radius:6px; background:#4cc9ff; color:#02030a; cursor:pointer; font-weight:600; }
  .wallet-card button:hover { opacity:0.85; }

  .add-wallet-card { background: rgba(10,15,40,0.6); border:1px dashed #4cc9ff; display:flex; justify-content:center; align-items:center; cursor:pointer; min-width:320px; height:140px; flex:1 1 320px; }
  .add-wallet-card button { font-size:20px; padding:12px 24px; }
</style>
</head>
<body>

<div class="bg-icons">
  <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" />
  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" />
  <img src="https://cryptologos.cc/logos/solana-sol-logo.png" />
</div>

<svg class="bg-graph" viewBox="0 0 1000 300" preserveAspectRatio="none">
  <polyline points="0,220 50,200 100,210 150,180 200,190 250,150 300,165 350,120 400,140 450,110 500,130 550,100 600,120 650,80 700,100 750,60 800,80 850,40 900,60 950,20 1000,40" />
</svg>

<header>
  <a href="index.html" class="logo">CryptoLocker</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="docs.html">Docs</a>
    <a href="security.html">Security</a>
  </nav>
  <div class="auth">
    <a href="login.html" class="login">Login</a>
    <a href="signup.html" class="signup">Sign Up</a>
  </div>
</header>

<main>
  <h1>Your Dashboard</h1>
  <p>View all your wallets, track balances, and manage your crypto securely in one place.</p>

  <div class="wallets-grid" id="walletsGrid">
    <!-- Wallet cards will be inserted here -->
  </div>
</main>

<footer>
  <p>© 2025 CryptoLocker. No custody. No access. No bullshit.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://mxofcfmkdovgyschmgop.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadWallets() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  const { data: wallets, error } = await supabase
    .from('wallets')
    .select('*')
    .eq('user_id', user.id)
    .order('added_at', { ascending: false });

  const grid = document.getElementById('walletsGrid');
  grid.innerHTML = '';

  if (error) {
    grid.innerHTML = `<div class="wallet-card">Error loading wallets: ${error.message}</div>`;
    return;
  }

  if (!wallets || wallets.length === 0) {
    grid.innerHTML = `<div class="add-wallet-card"><button id="addWalletBtn">+ Add Wallet</button></div>`;
  } else {
    wallets.forEach(wallet => {
      const card = document.createElement('div');
      card.classList.add('wallet-card');
      const addedDate = wallet.added_at ? new Date(wallet.added_at).toLocaleString() : 'Unknown';

      card.innerHTML = `
        <h3>${wallet.name || 'Unnamed Wallet'}</h3>
        <p><strong>Address:</strong> ${wallet.address}</p>
        <p><span class="balance-btc">${wallet.balance || 0} ${wallet.chain || 'BTC'}</span> | <span class="balance-fiat">${wallet.fiat || '0'} USD</span></p>
        <p><strong>Added:</strong> ${addedDate}</p>
        <button class="attest-btn">Attest Ownership</button>
        <button class="delete-btn">Delete Wallet</button>
      `;

      // Attestation
      card.querySelector('.attest-btn').addEventListener('click', async () => {
        const timestamp = new Date().toISOString();
        await supabase.from('user_logs').insert([{ user_id: user.id, action: `Attested wallet ${wallet.address} at ${timestamp}` }]);
        alert(`Wallet ${wallet.address} attested at ${timestamp}`);
      });

      // Delete
      card.querySelector('.delete-btn').addEventListener('click', async () => {
        if (!confirm(`Delete wallet ${wallet.address}?`)) return;
        const { error } = await supabase.from('wallets').delete().eq('id', wallet.id);
        if (error) return alert('Delete error: ' + error.message);
        loadWallets();
      });

      grid.appendChild(card);
    });

    // Add wallet card at end
    const addCard = document.createElement('div');
    addCard.classList.add('add-wallet-card');
    addCard.innerHTML = `<button id="addWalletBtn">+ Add Wallet</button>`;
    addCard.querySelector('#addWalletBtn').addEventListener('click', () => {
      const walletAddress = prompt('Enter wallet address:');
      if (!walletAddress) return;
      supabase.from('wallets').insert([{ user_id: user.id, address: walletAddress }]).then(() => loadWallets());
    });
    grid.appendChild(addCard);
  }
}

// Auto-refresh every 5 seconds
loadWallets();
setInterval(loadWallets, 5000);
</script>

</body>
</html>
