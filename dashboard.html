<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CryptoLocker Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h1>Your Dashboard</h1>
<div id="walletsGrid"></div>

<!-- Supabase v2 CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// Supabase config
const SUPABASE_URL = 'https://mxofcfmkdovgyschmgop.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b2ZjZm1rZG92Z3lzY2htZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjQ5NzMsImV4cCI6MjA4MjcwMDk3M30.LtsXpumBjrL-SsBZz5nKHk9Cw_4EL3EAmwujQhIyM4E';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadWallets() {
  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const user = session.user;
  const grid = document.getElementById('walletsGrid');
  grid.innerHTML = '';

  const { data: wallets, error } = await supabase
    .from('wallets')
    .select('*')
    .eq('user_id', user.id);

  if (error) {
    grid.innerHTML = `<div>Error loading wallets: ${error.message}</div>`;
    return;
  }

  if (!wallets || wallets.length === 0) {
    grid.innerHTML = `<div>No wallets added yet.</div>`;
  }

  for (const w of wallets) {
    const card = document.createElement('div');
    card.innerHTML = `
      <div>Address: ${w.address}</div>
      <div>BTC: loading… | USD: loading…</div>
      <div>Added: ${new Date(w.added_at).toLocaleString()}</div>
      <button class="attest">Attest Ownership</button>
      <button class="delete">Delete Wallet</button>
    `;
    grid.appendChild(card);

    // Attest button
    card.querySelector('.attest').onclick = async () => {
      await supabase.from('user_logs').insert([{
        user_id: user.id,
        action: `Attested wallet ${w.address} at ${new Date().toISOString()}`
      }]);
      alert(`Wallet ${w.address} attested.`);
    };

    // Delete button
    card.querySelector('.delete').onclick = async () => {
      if (!confirm(`Delete wallet ${w.address}?`)) return;
      await supabase.from('wallets').delete().eq('id', w.id);
      loadWallets();
    };

    // Fetch BTC & USD
    (async () => {
      try {
        const resp = await fetch(`https://blockstream.info/api/address/${w.address}`);
        const data = await resp.json();
        const balanceBTC = (data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum) / 1e8;

        const fiatResp = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd`);
        const fiatData = await fiatResp.json();
        const balanceUSD = (balanceBTC * fiatData.bitcoin.usd).toFixed(2);

        card.querySelector('div:nth-child(2)').textContent = `BTC: ${balanceBTC} | USD: ${balanceUSD}`;
      } catch {
        card.querySelector('div:nth-child(2)').textContent = `BTC: error | USD: error`;
      }
    })();
  }

  // Add Wallet button
  const add = document.createElement('div');
  add.innerHTML = `<button id="addWalletBtn">Add Wallet</button>`;
  grid.appendChild(add);

  document.getElementById('addWalletBtn').onclick = async () => {
    const addr = prompt('Enter BTC wallet address:');
    if (!addr) return;
    await supabase.from('wallets').insert([{ user_id: user.id, address: addr, added_at: new Date().toISOString() }]);
    loadWallets();
  };
}

// Load wallets on page load
loadWallets();
</script>

</body>
</html>
